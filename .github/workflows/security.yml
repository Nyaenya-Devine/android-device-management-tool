name: Security — CodeQL, Dependency Review, Secret Scan, Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL — SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  dependency-review:
    name: Dependency Review — Supply Chain
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD

  secret-scan:
    name: Secret Scan — TruffleHog + Grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Do not force BASE=main on push events: that makes BASE and HEAD identical
      # and causes TruffleHog to fail without scanning the commit.
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
      - name: Grep for credential patterns
        run: |
          set -eu
          ! grep -R --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git -E "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|vcp_[A-Za-z0-9]{20,}" .

  npm-audit:
    name: npm Audit — CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  web-security:
    name: Web Security Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify security configuration exists
        run: |
          set -eu
          test -f next.config.ts -o -f next.config.js -o -f next.config.mjs
          grep -R -q "Content-Security-Policy" next.config.*
          grep -R -q "X-Frame-Options" next.config.*
          grep -R -q "Strict-Transport-Security" next.config.*
