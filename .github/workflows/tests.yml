name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Python simulation layer (inherited from the Reset Lab lineage)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run safety and workflow tests
        run: |
          python -m pytest tests -q
      - name: Run attack simulation and verify detection
        run: |
          python attacker_sim.py
          python threat_detection.py
          python reports.py
          cat reports/dashboard.txt
      - name: Verify log integrity
        run: |
          python security_logger.py verify

  # Web app (Next.js live-management layer) — typecheck, lint, build
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        # DATABASE_URL only needs to be syntactically present at build time;
        # no database is contacted during `next build`.
        run: DATABASE_URL=postgresql://ci:ci@localhost:5432/ci npm run build
