name: CI — Build, Lint, TypeCheck

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Build, Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: TypeScript Check
        run: npm run typecheck
      - name: Next production build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Secret scan
        run: |
          set -eu
          ! grep -R -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git .
      - name: Verify essential files
        run: |
          set -eu
          test -f electron.js
          test -f preload.js
          test -f src/components/LinkedInChatDock.tsx
          test -f src/components/ToastSystem.tsx
          test -f src/components/Logo.tsx
          grep -q 'electron-updater' package.json
          grep -q 'autoUpdater' electron.js

  sbom:
    name: SBOM — CycloneDX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
